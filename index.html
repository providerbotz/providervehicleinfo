<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Info Finder | Providers</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="style.css">  

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="glitch-bg"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="glitch-text" data-text="VEHICLE INFO FINDER">VEHICLE INFO FINDER</h1>
            <p>Enter vehicle number to extract detailed information</p>
        </div>
        
        <div class="search-box">
            <h2><i class="fas fa-search"></i> SEARCH VEHICLE</h2>
            <div class="input-group">
                <input type="text" id="vehicleNumber" placeholder="ENTER NUMBER (Ex.UP26R4007)" value="">
                <button id="searchBtn"><i class="fas fa-bolt"></i> GET INFO</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>LOADING VEHICLE INFORMATION...</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            <p><i class="fas fa-exclamation-triangle"></i> 
            <span id="errorText">ERROR: PLEASE ENTER A VALID VEHICLE NUMBER</span>
            </p>
        </div>
        
        <div class="webview-container" id="webviewContainer">
            <h2><i class="fas fa-car-side"></i> VEHICLE INFORMATION</h2>
            <iframe id="apiWebView" src="" frameborder="0"></iframe>
        </div>
    </div>

    <div class="social-container">
        <div class="social-title">FOLLOW ME ON SOCIAL MEDIA</div>
        <div class="social-buttons">
            <a href="https://t.me/providerbotz" target="_blank" class="social-btn telegram">
                <i class="fab fa-telegram"></i>
            </a>
            <a href="https://t.me/providertrick" target="_blank" class="social-btn telegram">
                <i class="fab fa-telegram-plane"></i>
            </a>
            <a href="https://youtu.be/" target="_blank" class="social-btn youtube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://www.instagram.com/" target="_blank" class="social-btn instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
    
    <div class="footer">
        <p>POWERED BY PROVIDER API | SECURE DATA EXTRACTION SYSTEM</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchBtn = document.getElementById('searchBtn');
            const vehicleNumberInput = document.getElementById('vehicleNumber');
            const webviewContainer = document.getElementById('webviewContainer');
            const apiWebView = document.getElementById('apiWebView');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            function openAPIInWebView(vehicleNo) {
                if (vehicleNo) {
                    loading.style.display = 'block';
                    errorMessage.style.display = 'none';
                    webviewContainer.style.display = 'none';
                    
                    const apiUrl = `https://vehicle-info-api-five.vercel.app/vehicle=${vehicleNo}`;
                    
                    apiWebView.src = apiUrl;
                    
                    apiWebView.onload = function() {
                        loading.style.display = 'none';
                        webviewContainer.style.display = 'block';
                    };
                    
                    apiWebView.onerror = function() {
                        loading.style.display = 'none';
                        errorText.textContent = 'ERROR: FAILED TO LOAD VEHICLE INFORMATION';
                        errorMessage.style.display = 'block';
                    };
                } else {
                    errorText.textContent = 'ERROR: PLEASE ENTER A VALID VEHICLE NUMBER';
                    errorMessage.style.display = 'block';
                }
            }
            
            searchBtn.addEventListener('click', function() {
                const vehicleNo = vehicleNumberInput.value.trim();
                openAPIInWebView(vehicleNo);
            });
            
            vehicleNumberInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchBtn.click();
                }
            });
        });
    </script>
</body>
  </html>
